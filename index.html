<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRB Sports - Live Scoreboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f172a;
      background-image: linear-gradient(135deg, #0f172a, #1e293b);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #ffffff;
      padding: 20px;
      position: relative;
      transition: background-image 0.4s ease;
    }

    /* ব্যাকগ্রাউন্ড ছবির ওপর হালকা ডার্ক শেড */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.48);
      z-index: 0;
    }

    .scoreboard {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1020px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(14px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      padding: 44px 52px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
    }

    .team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 31%;
      text-align: center;
    }

    .logo-box {
      width: 145px;
      height: 145px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 3px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .logo-placeholder {
      font-size: 1rem;
      font-weight: 700;
      color: #94a3b8;
    }

    .team-name {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      word-break: break-word;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
    }

    .score-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: 38%;
    }

    /* লাল ও ধপধপ করা LIVE ব্যাজ */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #dc2626, #ef4444);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding: 8px 22px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      animation: liveGlow 1.2s infinite ease-in-out;
    }

    .live-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #ffffff;
      animation: dotBlink 1.2s infinite ease-in-out;
    }

    @keyframes liveGlow {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 12px rgba(239, 68, 68, 0.75);
      }
      50% {
        transform: scale(1.06);
        box-shadow: 0 0 28px rgba(239, 68, 68, 1);
      }
    }

    @keyframes dotBlink {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.2;
      }
    }

    /* বড় স্কোর */
    .score {
      font-size: 6.4rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: #ffffff;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 16px;
      text-shadow: 0 6px 25px rgba(0, 0, 0, 0.5);
      font-variant-numeric: tabular-nums;
    }

    .divider {
      color: #38bdf8;
    }

    /* সবার চোখে পড়ার মতো টাইমার */
    .timer-box {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(2, 6, 23, 0.85);
      border: 2px solid #facc15;
      color: #facc15;
      font-size: 2.35rem;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 10px 28px;
      border-radius: 16px;
      box-shadow: 0 0 22px rgba(250, 204, 21, 0.28);
      font-variant-numeric: tabular-nums;
    }

    .timer-icon {
      font-size: 1.7rem;
    }

    /* মোবাইল ও ছোট স্ক্রিনের জন্য রেসপনসিভ */
    @media (max-width: 768px) {
      .scoreboard {
        padding: 26px 18px;
        border-radius: 22px;
      }
      .logo-box {
        width: 84px;
        height: 84px;
        padding: 8px;
      }
      .team-name {
        font-size: 1.15rem;
      }
      .live-badge {
        font-size: 0.8rem;
        padding: 5px 14px;
        gap: 6px;
      }
      .live-dot {
        width: 8px;
        height: 8px;
      }
      .score {
        font-size: 3.4rem;
        gap: 8px;
      }
      .timer-box {
        font-size: 1.4rem;
        padding: 6px 16px;
        border-radius: 12px;
      }
      .timer-icon {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <div class="scoreboard">
    <!-- বাম পাশের দল -->
    <div class="team">
      <div class="logo-box">
        <img id="team1Logo" src="" alt="Team 1 Logo">
        <span id="team1Placeholder" class="logo-placeholder">LOGO</span>
      </div>
      <div id="team1Name" class="team-name">Team A</div>
    </div>

    <!-- মাঝখানের স্ট্যাটাস, স্কোর ও টাইমার -->
    <div class="score-section">
      <div id="liveBadge" class="live-badge">
        <span class="live-dot"></span>
        <span id="matchStatusText">LIVE</span>
      </div>

      <div class="score">
        <span id="team1Score">0</span>
        <span class="divider">-</span>
        <span id="team2Score">0</span>
      </div>

      <div id="timerBox" class="timer-box">
        <span class="timer-icon">⏱</span>
        <span id="timerDisplay">00:00</span>
      </div>
    </div>

    <!-- ডান পাশের দল -->
    <div class="team">
      <div class="logo-box">
        <img id="team2Logo" src="" alt="Team 2 Logo">
        <span id="team2Placeholder" class="logo-placeholder">LOGO</span>
      </div>
      <div id="team2Name" class="team-name">Team B</div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCPPXUn-8wbzu2HvhG_Lh5R8SDesFp-5i8",
      authDomain: "brb-sports-bangla.firebaseapp.com",
      databaseURL: "https://brb-sports-bangla-default-rtdb.firebaseio.com",
      projectId: "brb-sports-bangla",
      storageBucket: "brb-sports-bangla.firebasestorage.app",
      messagingSenderId: "507558167561",
      appId: "1:507558167561:web:233806ac51f8a0a442a4d8",
      measurementId: "G-VCFZTE49JJ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const scoreboardRef = db.ref('scoreboard');

    let serverOffset = 0;
    let timerState = { running: false, elapsedSeconds: 0, startTime: 0, show: true };

    // সার্ভার টাইম অফসেট নেওয়া যাতে সব ডিভাইসে একদম সঠিক টাইমার চলে
    db.ref('.info/serverTimeOffset').on('value', (snap) => {
      serverOffset = snap.val() || 0;
    });

    function formatTime(totalSeconds) {
      const safeSec = Math.max(0, Math.floor(totalSeconds));
      const mins = Math.floor(safeSec / 60);
      const secs = safeSec % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function updateTimerUI() {
      const timerBox = document.getElementById('timerBox');
      if (timerState.show === false) {
        timerBox.style.display = 'none';
        return;
      }
      timerBox.style.display = 'inline-flex';

      let totalSeconds = timerState.elapsedSeconds || 0;
      if (timerState.running && timerState.startTime) {
        const now = Date.now() + serverOffset;
        const diff = Math.max(0, Math.floor((now - timerState.startTime) / 1000));
        totalSeconds += diff;
      }
      document.getElementById('timerDisplay').textContent = formatTime(totalSeconds);
    }

    setInterval(updateTimerUI, 500);

    function setLogo(imgEl, placeholderEl, url) {
      if (url && url.trim() !== '') {
        imgEl.src = url.trim();
        imgEl.style.display = 'block';
        placeholderEl.style.display = 'none';
        imgEl.onerror = () => {
          imgEl.style.display = 'none';
          placeholderEl.style.display = 'block';
        };
      } else {
        imgEl.src = '';
        imgEl.style.display = 'none';
        placeholderEl.style.display = 'block';
      }
    }

    // Firebase থেকে রিয়েল-টাইম ডাটা লোড
    scoreboardRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      // ব্যাকগ্রাউন্ড ইমেজ
      if (data.bgImage && data.bgImage.trim() !== '') {
        document.body.style.backgroundImage = `url('${data.bgImage.trim()}')`;
      } else {
        document.body.style.backgroundImage = 'linear-gradient(135deg, #0f172a, #1e293b)';
      }

      // টিম ১
      document.getElementById('team1Name').textContent = data.team1?.name || 'Team A';
      document.getElementById('team1Score').textContent = data.team1?.score ?? 0;
      setLogo(
        document.getElementById('team1Logo'),
        document.getElementById('team1Placeholder'),
        data.team1?.logo
      );

      // টিম ২
      document.getElementById('team2Name').textContent = data.team2?.name || 'Team B';
      document.getElementById('team2Score').textContent = data.team2?.score ?? 0;
      setLogo(
        document.getElementById('team2Logo'),
        document.getElementById('team2Placeholder'),
        data.team2?.logo
      );

      // লাল ব্লিঙ্কিং স্ট্যাটাস ব্যাজ
      const badgeEl = document.getElementById('liveBadge');
      const statusTextEl = document.getElementById('matchStatusText');
      if (data.status && data.status.trim() !== '') {
        statusTextEl.textContent = data.status.trim();
        badgeEl.style.display = 'inline-flex';
      } else {
        badgeEl.style.display = 'none';
      }

      // টাইমার ডাটা আপডেট
      if (data.timer) {
        timerState = {
          running: !!data.timer.running,
          elapsedSeconds: data.timer.elapsedSeconds || 0,
          startTime: data.timer.startTime || 0,
          show: data.timer.show !== false
        };
      }
      updateTimerUI();
    });
  </script>

</body>
</html>
